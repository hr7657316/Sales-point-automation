line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "DTZ"]
ignore = [
    # Fit dates, RX dates and payroll deadlines are calendar dates with no
    # timezone, so naive date objects are the correct representation here.
    "DTZ007",
    "DTZ011",
]

[lint.per-file-ignores]
# The UI module embeds an HTML/CSS template; long lines are the markup.
"sales_points/ui.py" = ["E501"]
